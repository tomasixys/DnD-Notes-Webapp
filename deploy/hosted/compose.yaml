name: dnd-notes-hosted

services:
  database:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd_notes
      POSTGRES_USER: dnd_notes
      POSTGRES_PASSWORD: ${DND_NOTES_POSTGRES_PASSWORD:?Set DND_NOTES_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      hosted:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_notes -d dnd_notes"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  storage-init:
    image: dnd-notes-hosted:local
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile
    user: "0:0"
    network_mode: none
    command:
      [
        "sh",
        "-c",
        "chown 10001:10001 /var/lib/dnd-notes && chmod 750 /var/lib/dnd-notes",
      ]
    volumes:
      - ./data:/var/lib/dnd-notes
    security_opt:
      - no-new-privileges:true

  app:
    image: dnd-notes-hosted:local
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DND_NOTES_DATABASE_URL: postgresql+psycopg://dnd_notes:${DND_NOTES_POSTGRES_PASSWORD}@database:5432/dnd_notes
      DND_NOTES_SESSION_SECRET: ${DND_NOTES_SESSION_SECRET:?Set DND_NOTES_SESSION_SECRET in .env}
    volumes:
      - ./hosted.toml:/etc/dnd-notes/hosted.toml:ro
      - ./data:/var/lib/dnd-notes
    expose:
      - "8000"
    networks:
      hosted:
        ipv4_address: 172.30.0.10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': 'royalen.no'}); urllib.request.urlopen(request, timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${DND_NOTES_HTTP_PORT:-80}:80"
      - "${DND_NOTES_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      hosted:
        ipv4_address: 172.30.0.11
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  hosted:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
